<div class="auth-page">
  <div class="auth-card">
    <p class="auth-brand">CoChat</p>
    <p class="auth-subtitle">Create your team account</p>

    @if (error()) {
      <div class="error-banner">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" [(ngModel)]="fullName" placeholder="Jane Doe" />
      </div>

      <div class="identifier-tabs">
        <button type="button" [class.active]="identifierType === 'email'" (click)="identifierType = 'email'">Email</button>
        <button type="button" [class.active]="identifierType === 'mobile'" (click)="identifierType = 'mobile'">Mobile number</button>
      </div>

      @if (identifierType === 'email') {
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" [(ngModel)]="email" autocomplete="email" placeholder="you@company.com" />
        </div>
      } @else {
        <div class="field">
          <label for="mobile">Mobile number</label>
          <input id="mobile" name="mobile" type="tel" [(ngModel)]="mobile" autocomplete="tel" placeholder="+1 555 000 1234" />
        </div>
      }

      <div class="field">
        <label for="designation">Designation (optional)</label>
        <input id="designation" name="designation" type="text" [(ngModel)]="designation" placeholder="Software Engineer" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="new-password" placeholder="At least 6 characters" />
      </div>

      <button class="btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-footer">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
