<div class="settings-page">
  <h1>Settings</h1>

  <div class="settings-section">
    <h2>Notifications</h2>
    <label class="toggle-row">
      <div>
        <div class="toggle-title">Desktop notifications</div>
        <div class="toggle-subtitle">Get notified of new messages while CoChat is in the background</div>
      </div>
      <input type="checkbox" [checked]="desktopNotifications()" (change)="toggleDesktopNotifications()" />
    </label>
    @if (permission() === 'denied') {
      <p class="hint">Notifications are blocked in your browser settings.</p>
    }
  </div>

  <div class="settings-section">
    <h2>Account</h2>
    <div class="account-row">
      <span>Signed in as</span>
      <strong>{{ auth.currentUser()?.email || auth.currentUser()?.mobile }}</strong>
    </div>
    <button class="logout-btn" (click)="logout()">Log out</button>
  </div>
</div>
