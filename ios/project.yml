name: CoChat
options:
  bundleIdPrefix: com.cochat
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0

targets:
  CoChat:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CoChat
        excludes:
          - "Resources/Info.plist"
          - "**/.DS_Store"
    dependencies:
      - package: SocketIO
    info:
      path: CoChat/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cochat.app
        SWIFT_VERSION: 5.9
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
